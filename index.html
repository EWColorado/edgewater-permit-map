const html=(k,open)=>AT[k].length>1?listAt(k,open):info(AT[k][0]);
const narrow=()=>matchMedia('(max-width:699px)').matches;const PO={maxWidth:300,maxHeight:340,autoPanPaddingTopLeft:[10,narrow()?120:10],autoPanPaddingBottomRight:[narrow()?10:340,10]};
P.forEach(p=>{const due=p.due?1:0;p.m=ym(p.dt);

const MIN=Math.min(...P.map(p=>p.m)),MAX=Math.max(...P.map(p=>p.m));let CUT=MIN,END=MAX;
const SNAP=[];for(let y=Math.floor(MIN/12)+1;y*12<=MAX;y++)SNAP.push(y*12);
const NOW=Math.floor(MAX/12);const YRS=[{a:MIN,b:MAX,t:'All'},{a:MIN,b:(NOW-1)*12-1,t:'Before '+(NOW-1)},{a:(NOW-1)*12,b:MAX,t:(NOW-1)+'+'},{a:NOW*12,b:MAX,t:NOW+'+'}];
function draw(){grp.clearLayers();const n={};let t=0;
 const stOk=p=>ST==='all'||STAT[ST](p.st);
 P.forEach(p=>{if(p.m>=CUT&&p.m<=END&&stOk(p)){n[p.cat]=(n[p.cat]||0)+1;if(on[p.cat]){grp.addLayer(p.mk);t++;}}});
 document.querySelectorAll('[data-n]').forEach(s=>s.textContent=n[s.dataset.n]||0);
 document.getElementById('cutlbl').textContent=lbl(CUT)+' – '+lbl(END);const cut=document.getElementById('cut'),span=(MAX-MIN)||1;cut.value=CUT;document.getElementById('end').value=END;cut.style.zIndex=CUT>MIN+span/2?3:1;const fill=document.getElementById('fill');fill.style.left=(CUT-MIN)/span*100+'%';fill.style.right=(MAX-END)/span*100+'%';document.querySelectorAll('[data-st]').forEach(b=>b.classList.toggle('act',b.dataset.st===ST));document.querySelectorAll('[data-yr]').forEach(b=>b.classList.toggle('act',+b.dataset.yr===CUT&&+b.dataset.to===END));document.getElementById('tot').textContent=t;}
const SW={STREET:'ST',AVENUE:'AVE',AV:'AVE',AVNEUE:'AVE',AVVE:'AVE',BOULEVARD:'BLVD',COURT:'CT',PLACE:'PL',LANE:'LN',DRIVE:'DR',ROAD:'RD',CIRCLE:'CIR',WEST:'W',NORTH:'N'};
const ENDS=new Set(['ST','AVE','BLVD','CT','PL','LN','DR','RD','CIR','WAY','PKWY']),CUT_AT=new Set(['UNIT','UNITS','APT','STE','SUITE','BLDG','BUILDING']),DROP=new Set(['EDGEWATER','CO','COLORADO','80214']);
const norm=s=>{const w=s.toUpperCase().replace(/LAKESHORE/g,'LAKE SHORE').replace(/[.,#"']/g,' ').split(/\s+/).filter(Boolean).map(x=>SW[x]||x).filter(x=>!DROP.has(x)).filter((x,i)=>!(i===1&&x==='N'));const end=w.findIndex((x,i)=>CUT_AT.has(x));const cut=end<0?w:w.slice(0,end);const st=cut.findIndex((x,i)=>i>0&&ENDS.has(x));return st<0?cut:cut.slice(0,st+1);};
const SPOT={};A.forEach(([k,lat,lon])=>{SPOT[k]={k,lat,lon};});
Object.keys(AT).forEach(k=>{if(!SPOT[k]){const g=AT[k];SPOT[k]={k,lat:g.reduce((s,p)=>s+p.lat,0)/g.length,lon:g.reduce((s,p)=>s+p.lon,0)/g.length};}});
const ALL=Object.values(SPOT);ALL.forEach(a=>{a.w=a.k.split(' ');});
const find=t=>{const w=norm(t);if(!w.length)return[];const match=q=>ALL.filter(a=>q.every(x=>a.w.some(y=>y.startsWith(x))));let hit=match(w);if(!hit.length&&w.length>2&&ENDS.has(w[w.length-1]))hit=match(w.slice(0,-1));const rank=a=>(a.w[0]===w[0]?0:2)+(AT[a.k]?0:1);return hit.sort((a,b)=>rank(a)-rank(b)||a.k.localeCompare(b.k)).slice(0,6);};
const nearest=t=>{const w=norm(t),n=parseInt(w[0],10);if(!n||w.length<2)return null;const c=ALL.filter(a=>w.slice(1).every(x=>a.w.slice(1).some(y=>y.startsWith(x))));if(!c.length)return null;const gap=a=>Math.abs(parseInt(a.w[0],10)-n)+(parseInt(a.w[0],10)%2===n%2?0:.5);return c.reduce((x,y)=>gap(y)<gap(x)?y:x);};
let pin=null,touched=false;
const CREATED_BY='Kit Lammers, City of Edgewater, 2026';console.info('Edgewater Active Permit Map. Created by '+CREATED_BY+', with AI.');
const egg=()=>{touched=true;clearPin();L.popup(PO).setLatLng(map.getCenter()).setContent('<b>You found the easter egg!</b><br>This map was created by Kit Lammers, City of Edgewater, with AI in 2026.').openOn(map);};
const isEgg=t=>/^(kit\s+)?lammers$/i.test(t.trim());const clearPin=()=>{if(pin){map.removeLayer(pin);pin=null;}};
const nearby=a=>{const here=L.latLng(a.lat,a.lon);const r=Object.keys(AT).filter(k=>k!==a.k).map(k=>({k,d:Math.round(here.distanceTo([SPOT[k].lat,SPOT[k].lon])*3.281/10)*10})).filter(x=>x.d<=1000).sort((x,y)=>x.d-y.d).slice(0,6);if(!r.length)return '<br>No active permits within 1,000 ft.';return '<br><b>Nearby active permits:</b>'+r.map(x=>`<br><a href="#" data-go="${esc(x.k)}">${esc(x.k)}</a> · ${AT[x.k].length>1?AT[x.k].length+' permits':esc(AT[x.k][0].type)} · ${x.d} ft`).join('');};
const goTo=(a,exact=true,open)=>{touched=true;clearPin();const g=AT[a.k];let body;if(g&&exact){body=html(a.k,open);map.setView([a.lat,a.lon],18,{animate:false});}else{pin=L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:'<div class="pin"></div>',iconSize:[22,22],iconAnchor:[11,22]}),interactive:false}).addTo(map);body=`<b>${esc(a.k)}</b><br>`+(exact?'No active permits at this address.':'Exact address not found. This is the closest address on that street.')+(g?`<br><a href="#" data-go="${esc(a.k)}">Permits at this address</a>`:'')+nearby(a);map.setView([a.lat,a.lon],17,{animate:false});}L.popup({...PO,offset:[0,g&&exact?-4:-18]}).setLatLng([a.lat,a.lon]).setContent(body).openOn(map);};
let openPop=null;map.on('popupopen',e=>{openPop=e.popup;});
document.addEventListener('toggle',e=>{const c=e.target.closest&&e.target.closest('.leaflet-popup-content');if(!c||!openPop)return;const top=c.scrollTop;openPop._updateLayout();openPop._updatePosition();openPop._autopanning=false;openPop._adjustPan();c.scrollTop=top;if(e.target.open){const d=e.target.getBoundingClientRect(),b=c.getBoundingClientRect();if(d.bottom>b.bottom)c.scrollTop+=Math.min(d.bottom-b.bottom,d.top-b.top);}},true);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-go]');if(a){e.preventDefault();goTo(SPOT[a.dataset.go]);}});
const ABOUT=`<div id="aboutBox" role="dialog" aria-modal="true" aria-labelledby="aboutT"><button id="aboutX" aria-label="Close">&times;</button><h2 id="aboutT">About this map</h2><p>This map shows active City of Edgewater permits from CommunityCore, placed using Jefferson County's address data.</p><h3>What's included</h3><p>Active permits only. It leaves out closed permits, test records, permits at the Deposit Refund: Pending stage, and addresses outside Edgewater.</p><h3>How current it is</h3><p>Data as of ${AS_OF}. This map doesn't update automatically, so check CommunityCore for the latest status.</p><h3>Quick tips</h3><ul><li>Click a dot for details. Addresses with several permits show them in one list.</li><li>Search an address to see nearby permits, even if that address has none.</li><li>Use the buttons and checkboxes to filter by category, status or date.</li></ul><h3>Disclaimer</h3><p>This map is for general information only and is provided as is. Permit details and locations may be incomplete or out of date. Please confirm anything important in CommunityCore or with City staff.</p><h3>Accessibility</h3><p>If you need this information in another format, call 720.763.3008 or use <a href="http://www.edgewaterco.com/AskEdgewater" target="_blank" rel="noopener">AskEdgewater</a>.</p></div>`;
const lg=L.control({position:'topright'});
lg.onAdd=()=>{const d=L.DomUtil.create('div','panel');
 d.innerHTML='<div class="hd"><h3>Active permits (<span id="tot"></span> shown)</h3><div class="tools"><button id="info" aria-label="About this map" aria-haspopup="dialog">i</button><button id="menu" aria-label="Show or hide filters" aria-expanded="true">&#9776;</button></div></div><div class="srch"><input id="q" type="search" placeholder="Address or permit #" aria-label="Search address or permit number" autocomplete="off"><div id="sug"></div></div><div id="body"><div class="seg"><button data-base="map" class="act">Map</button><button data-base="aerial">Aerial</button></div>'+'<div style="margin-bottom:4px"><a href="#" id="all">Select all</a> · <a href="#" id="none">Clear all</a></div>'+Object.keys(C).map(k=>`<label><input type="checkbox" checked data-k="${k}"> <span class="sw" style="background:${C[k]}"></span>${k} (<span data-n="${k}"></span>) <a href="#" class="only" data-o="${k}">only</a></label>`).join('')+
 `<hr style="border:0;border-top:1px solid #ddd"><div>Status:</div><div class="seg"><button data-st="all">All</button><button data-st="insp">Inspections</button><button data-st="hold">On hold</button><button data-st="rev">Review</button><button data-st="iss">Issuance</button></div>`+
 `<hr style="border:0;border-top:1px solid #ddd"><div>Accepted: <b id="cutlbl"></b></div><div class="seg">${YRS.map(y=>`<button data-yr="${y.a}" data-to="${y.b}">${y.t}</button>`).join('')}</div><div class="dual"><div class="trk"></div><div class="fill" id="fill"></div><input id="cut" aria-label="Accepted from" type="range" min="${MIN}" max="${MAX}" value="${MIN}" step="1"><input id="end" aria-label="Accepted through" type="range" min="${MIN}" max="${MAX}" value="${MAX}" step="1" style="z-index:2"></div><div style="display:flex;justify-content:space-between;font-size:11px;color:#666"><span>${lbl(MIN)}</span><span>${lbl(MAX)}</span></div>`+
 '<div class="note">'+(FEES?'<span>Black ring = balance due</span> · ':'')+'<span>Data as of '+AS_OF+'</span></div></div>';
 L.DomEvent.disableClickPropagation(d);if(L.DomEvent.disableScrollPropagation)L.DomEvent.disableScrollPropagation(d);
 d.querySelectorAll('input[type=checkbox]').forEach(i=>i.onchange=()=>{on[i.dataset.k]=i.checked;draw();});
 const setAll=fn=>{d.querySelectorAll('input[type=checkbox]').forEach(i=>{i.checked=fn(i.dataset.k);on[i.dataset.k]=i.checked;});draw();};
 d.querySelector('#all').onclick=e=>{e.preventDefault();setAll(()=>true);};
 d.querySelector('#none').onclick=e=>{e.preventDefault();setAll(()=>false);};
 d.querySelectorAll('.only').forEach(a=>a.onclick=e=>{e.preventDefault();e.stopPropagation();setAll(k=>k===a.dataset.o);});
 d.querySelector('#cut').oninput=e=>{let v=+e.target.value;const j=SNAP.find(s=>Math.abs(s-v)<=1);if(j!==undefined)v=j;CUT=Math.min(v,END);draw();};
 d.querySelector('#end').oninput=e=>{let v=+e.target.value;const j=SNAP.find(s=>Math.abs(s-1-v)<=1);if(j!==undefined)v=j-1;END=Math.max(v,CUT);draw();};
 d.querySelectorAll('[data-yr]').forEach(b=>b.onclick=()=>{CUT=+b.dataset.yr;END=+b.dataset.to;draw();});
 d.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>{ST=b.dataset.st;draw();});
 const info=d.querySelector('#info'),about=document.createElement('div');about.id='about';about.innerHTML=ABOUT;document.body.appendChild(about);const aboutX=about.querySelector('#aboutX');const showAbout=o=>{about.classList.toggle('on',o);(o?aboutX:info).focus();};info.onclick=()=>showAbout(true);aboutX.onclick=()=>showAbout(false);about.onclick=e=>{if(e.target===about)showAbout(false);};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&about.classList.contains('on'))showAbout(false);});
 const body=d.querySelector('#body'),menu=d.querySelector('#menu'),q=d.querySelector('#q'),sug=d.querySelector('#sug');const shown=()=>getComputedStyle(body).display!=='none';const setOpen=o=>{d.classList.toggle('open',o);d.classList.toggle('closed',!o);menu.setAttribute('aria-expanded',o);};menu.onclick=()=>setOpen(!shown());map.on('click',()=>{if(narrow())setOpen(false);});setTimeout(()=>menu.setAttribute('aria-expanded',shown()),0);
 const choose=(a,exact,open)=>{q.value=a.k;sug.innerHTML='';if(narrow())setOpen(false);goTo(a,exact,open);};const results=()=>{const t=q.value.trim(),hit=find(t).map(a=>({a,exact:true}));const near=hit.length?null:nearest(t);if(near)hit.push({a:near,exact:false});const ids=t.length>2?P.filter(p=>p.id.includes(t.toUpperCase())).slice(0,4).map(p=>({a:SPOT[p.key],exact:true,id:p.id,p})):[];return ids.concat(hit);};
 q.oninput=()=>{const t=q.value.trim();clearPin();sug.innerHTML='';if(!t)return;if(isEgg(t)){const b=document.createElement('button');b.textContent='About this map';b.onclick=e=>{e.stopPropagation();sug.innerHTML='';egg();};sug.appendChild(b);return;}const r=results();if(!r.length){sug.innerHTML='<div class="none">No Edgewater address found</div>';return;}r.forEach(x=>{const b=document.createElement('button');b.textContent=x.id?x.id+' · '+x.a.k:(x.exact?'':'Closest: ')+x.a.k+(AT[x.a.k]&&x.exact?' ('+AT[x.a.k].length+')':'');b.onclick=e=>{e.stopPropagation();choose(x.a,x.exact,x.p);};sug.appendChild(b);});};
 q.onkeydown=e=>{if(e.key==='Enter'){if(isEgg(q.value)){sug.innerHTML='';egg();return;}const r=results();if(r.length)choose(r[0].a,r[0].exact,r[0].p);}else if(e.key==='Escape'){q.value='';sug.innerHTML='';clearPin();}};
 d.querySelectorAll('[data-base]').forEach(b=>b.onclick=()=>{const air=b.dataset.base==='aerial';map.removeLayer(air?street:aerial);map.addLayer(air?aerial:street);d.querySelectorAll('[data-base]').forEach(x=>x.classList.toggle('act',x===b));});return d;};
